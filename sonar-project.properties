
# Configuración del proyecto para SonarQube

# Identificación del proyecto
sonar.projectKey=security-lab
sonar.projectName=Laboratorio de Seguridad
sonar.projectVersion=1.0

# Directorios de código fuente
sonar.sources=.

# Codificación del código fuente
sonar.sourceEncoding=UTF-8

# Lenguaje del proyecto
sonar.language=py

# Excluir archivos (opcional)
sonar.exclusions=**/*.txt,**/*.md

# Host y token (reemplazar con tu token)
sonar.host.url=http://localhost:9000
sonar.login=TU_TOKEN_AQUI